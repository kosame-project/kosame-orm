services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kosame
      POSTGRES_PASSWORD: kosame
      POSTGRES_DB: kosame_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosame -d kosame_test"]
      interval: 2s
      timeout: 2s
      retries: 15

  mysql:
    image: mysql:9
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_USER: kosame
      MYSQL_PASSWORD: kosame
      MYSQL_DATABASE: kosame_test
    ports:
      - "33307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ukosame", "-pkosame"]
      interval: 2s
      timeout: 2s
      retries: 30
